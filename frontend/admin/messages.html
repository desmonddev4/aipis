<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D3D26">
  <title>Messages | AIPIS Admin</title>
  <link rel="icon" href="../assets/AIPIS-LOGO.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="js/lib/api.js"></script>
  <script src="js/lib/icons.js"></script>
  <script src="js/lib/ui.js"></script>
  <style>
    :root { --green-950: #082a1a; --green-900: #0d3d26; --green-700: #1a5c2a; --green-600: #237a38; --green-100: #dcebe0; --green-50: #eef6f0; --orange-500: #f4a24c; --orange-400: #f7b36b; --orange-300: #ffc98a; --orange-100: #ffeed9; --orange-50: #fff8ef; --ink: #10261a; --ink-soft: #35493d; --bg: #f2f6f1; --radius: 20px; --shadow: 0 8px 24px rgba(13, 61, 38, 0.08); --shadow-lg: 0 20px 50px rgba(13, 61, 38, 0.2); --font-head: "Archivo", system-ui, sans-serif; --font-body: "Source Sans 3", system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6; color: var(--ink); background: radial-gradient(700px 420px at 100% 0%, rgba(244, 162, 76, 0.12), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(26, 92, 42, 0.08), transparent 60%), var(--bg); background-attachment: fixed; }
    h1, h2, h3 { font-family: var(--font-head); color: var(--green-900); line-height: 1.2; margin: 0 0 0.5em; letter-spacing: -0.01em; }
    h1 { font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem); font-weight: 800; }
    h2 { font-size: 1.25rem; font-weight: 700; }
    p { margin: 0 0 1em; }
    a { color: var(--green-700); text-underline-offset: 3px; }
    a:hover { color: var(--green-900); }
    button { font: inherit; }
    svg { display: block; flex-shrink: 0; }
    :focus-visible { outline: 3px solid var(--orange-500); outline-offset: 2px; border-radius: 6px; }
    .muted { color: var(--ink-soft); }
    .muted-p { color: var(--ink-soft); font-size: 0.96rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem 1.3rem; border-radius: 999px; border: 2px solid transparent; font-family: var(--font-head); font-weight: 700; font-size: 0.98rem; line-height: 1.2; text-decoration: none; cursor: pointer; transition: transform 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s, border-color 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: none; }
    .btn[disabled] { opacity: 0.6; cursor: wait; transform: none; }
    .btn-sm { padding: 0.45rem 0.95rem; font-size: 0.9rem; }
    .btn-primary { background: var(--orange-500); color: var(--green-950); box-shadow: 0 6px 16px rgba(244, 162, 76, 0.38); }
    .btn-primary:hover { background: var(--orange-400); color: var(--green-950); box-shadow: 0 10px 22px rgba(244, 162, 76, 0.5); }
    .btn-outline { background: #fff; color: var(--green-900); border-color: var(--green-700); }
    .btn-outline:hover { background: var(--green-700); color: #fff; }
    .btn-danger { background: #b3261e; color: #fff; }
    .btn-danger:hover { background: #8f1d16; color: #fff; }

    .field { display: grid; gap: 0.35rem; margin-bottom: 1rem; }
    label { font-weight: 700; color: var(--green-900); font-size: 0.96rem; }
    input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 2px solid rgba(26, 92, 42, 0.28); border-radius: 14px; padding: 0.7rem 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange-500); box-shadow: 0 0 0 4px rgba(244, 162, 76, 0.3); }
    input:disabled { background: var(--green-50); color: var(--ink-soft); }
    .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: #b3261e; }
    .hint { color: var(--ink-soft); font-size: 0.88rem; }
    .check-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; cursor: pointer; }
    .check-row input { width: 20px; height: 20px; accent-color: var(--green-700); }
    .form-status { min-height: 1.4em; margin: 0.4rem 0; font-weight: 600; }
    .form-status.err { color: #b3261e; }
    .form-status.ok { color: var(--green-700); }

    .card { background: rgba(255, 255, 255, 0.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(26, 92, 42, 0.14); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(1.1rem, 2vw, 1.6rem); }
    .card.flush { padding: 0; overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
    .card-head h2 { margin: 0; }
    .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.6rem; }
    .page-head p { color: var(--ink-soft); margin: 0; max-width: 62ch; }
    .head-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <script src="js/components/sidebar.js"></script>
    <main class="admin-main" id="listPage" data-kinds="contact">
      <header class="page-head">
        <div><h1>Messages</h1><p>General messages sent from the contact form.</p></div>
      </header>
      <div id="listRoot"></div>
    </main>
  <script src="js/components/submissions-list.js"></script>
</body>
</html>
