<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D3D26">
  <title>Roundtable invitation requests | AIPIS Admin</title>
  <link rel="icon" href="../assets/register%20and%20favicon%20logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="js/lib/api.js"></script>
  <script src="js/lib/icons.js"></script>
  <script src="js/lib/ui.js"></script>
  <style>
    :root { --green-950: #082a1a; --green-900: #0d3d26; --green-700: #1a5c2a; --green-600: #237a38; --green-100: #dcebe0; --green-50: #eef6f0; --orange-500: #f4a24c; --orange-400: #f7b36b; --orange-300: #ffc98a; --orange-100: #ffeed9; --orange-50: #fff8ef; --ink: #10261a; --ink-soft: #35493d; --bg: #f2f6f1; --radius: 20px; --shadow: 0 8px 24px rgba(13, 61, 38, 0.08); --shadow-lg: 0 20px 50px rgba(13, 61, 38, 0.2); --font-head: "Archivo", system-ui, sans-serif; --font-body: "Source Sans 3", system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6; color: var(--ink); background: radial-gradient(700px 420px at 100% 0%, rgba(244, 162, 76, 0.12), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(26, 92, 42, 0.08), transparent 60%), var(--bg); background-attachment: fixed; }
    h1, h2, h3 { font-family: var(--font-head); color: var(--green-900); line-height: 1.2; margin: 0 0 0.5em; letter-spacing: -0.01em; }
    h1 { font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem); font-weight: 800; }
    p { margin: 0 0 1em; }
    a { color: var(--green-700); text-underline-offset: 3px; }
    a:hover { color: var(--green-900); }
  </style>
</head>
<body>
  <script src="js/components/sidebar.js"></script>
  <main class="admin-main" id="listPage" data-kinds="roundtable">
    <header class="page-head">
      <div><h1>Roundtable invitation requests</h1><p>Requests for consideration to attend one of the AIPIS Roundtables.</p></div>
    </header>
    <div id="listRoot"></div>
  </main>
  <script src="js/components/submissions-list.js"></script>
</body>
</html>
