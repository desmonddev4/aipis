<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration payment | AIPIS 2028</title><style>body{margin:0;padding:2rem;font:18px/1.6 system-ui,sans-serif;color:#153b27;background:#f6f9f6}main{max-width:760px;margin:8vh auto;padding:2rem;background:#fff;border-radius:16px}a{color:#16692f}</style></head>
<body><main class="container section" style="max-width:760px;margin:8vh auto"><p class="eyebrow">AIPIS 2028</p><h1 id="title">Checking your payment</h1><p id="message" aria-live="polite">Please wait while we check your registration payment.</p><p><a class="btn btn-primary" href="register.html">Return to registration</a></p></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const status = params.get("status");
  const id = params.get("registration");
  const title = document.getElementById("title");
  const message = document.getElementById("message");
  if (status === "success") { title.textContent = "Registration confirmed"; message.textContent = id ? "Payment received for registration #" + id + ". A confirmation will be sent to your email." : "Payment received. A confirmation will be sent to your email."; }
  else if (status === "pending") { title.textContent = "Payment is being confirmed"; message.textContent = "Your payment is still being verified. Contact the AIPIS secretariat with registration number " + (id || "") + "."; }
  else { title.textContent = "Payment was not completed"; message.textContent = "No successful payment was confirmed. Return to registration or contact the AIPIS secretariat for help."; }
})();
</script></body></html>
