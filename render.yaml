services:
  - type: web
    name: aipis-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    disk:
      name: aipis-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: aipis-db
          property: connectionString
      # Set to your Vercel URL, e.g. https://aipis.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NOTIFY_EMAIL
        value: info@aipisgh.org
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: aipis-db
    plan: free
